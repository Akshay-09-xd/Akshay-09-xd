<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Akshay — building useful software</title><desc id="desc">Subtle animated circuit lights around a software engineering introduction.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#14253b"/></linearGradient><linearGradient id="line"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<rect width="1200" height="260" rx="24" fill="url(#bg)"/>
<g fill="none" stroke="url(#line)" stroke-width="2" opacity=".42"><path d="M0 185h115l42-42h110l46 46h83"/><path d="M1200 59h-110l-43 43H935l-35-35h-75"/><path d="M1200 190h-140l-40-40h-72"/><path d="M0 72h91l43 43h93"/></g>
<g fill="#38bdf8"><circle cx="396" cy="189" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="825" cy="67" r="5"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="948" cy="150" r="5"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></circle></g>
<text x="70" y="100" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="54">Hi, I'm Akshay.</text>
<text x="72" y="149" fill="#a5f3fc" font-family="Arial,Helvetica,sans-serif" font-size="25">Full-stack development  •  Machine learning  •  Security</text>
<text x="72" y="206" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="19">I build working systems and make the reasoning behind them visible.</text>
